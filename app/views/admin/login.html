<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Login - SmartSeed</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans'; background: #1e293b; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;}
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;}
        .error { color: red; font-size: 13px; margin-bottom: 10px;}
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="color: #1e293b;">Admin Portal</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="email" name="email" placeholder="Admin Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
